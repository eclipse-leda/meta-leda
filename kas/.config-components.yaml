# Every file needs to contain a header, that provides kas with information
# about the context of this file.
header:
  # The `version` entry in the header describes for which configuration
  # format version this file was created for. It is used by kas to figure
  # out if it is compatible with this file. The version is an integer that
  # is increased on every format change.
  version: 12
# The machine as it is written into the `local.conf` of bitbake.
# machine: qemux86-64
# The distro name as it is written into the `local.conf` of bitbake.
target:
  - packagegroup-sdv-core
  - packagegroup-sdv-additions
  - packagegroup-sdv-examples
  - packagegroup-sdv-tools
local_conf_header:
  needed-features: |
    DISTRO_FEATURES += " sdv rauc virtualization"
    INHERIT += " rm_work"
repos:
  # This entry includes the repository where the config file is located
  # to the bblayers.conf:
  # Here we include a list of layers from the poky repository to the
  # bblayers.conf:
  bitbake:
    url: https://github.com/openembedded/bitbake.git
    tag: yocto-6.0.3
    commit: fae9db3168dbff1b8c76fe9c6726a9687ff97514
    layers: {}
  openembedded-core:
    url: https://github.com/openembedded/openembedded-core.git
    tag: yocto-6.0.3
    commit: ef022bf82d79015802309d14c28b13373ebe53f5
    layers:
      meta:
  poky:
    url: "https://git.yoctoproject.org/meta-yocto/"
    branch: wrynose
    layers:
      meta-poky:
      meta-yocto-bsp:
  meta-lts-mixins-rust:
    url: "https://git.yoctoproject.org/git/meta-lts-mixins"
    branch: wrynose/rust
  meta-lts-mixins-go:
    url: "https://git.yoctoproject.org/git/meta-lts-mixins"
    branch: wrynose/go
  meta-clang:
    url: https://github.com/kraj/meta-clang
    branch: wrynose
  meta-rauc:
    url: "https://github.com/rauc/meta-rauc.git"
    branch: wrynose
  # FIXME: Temporarily switch to a fork which supports wrynose.
  # Switch back to github.com/eclipse-kanto/meta-kanto.git once it officially supports wrynose.
  meta-kanto:
    url: "https://github.com/mikehaller/meta-kanto.git"
    branch: wrynose
  meta-virtualization:
    url: "https://git.yoctoproject.org/meta-virtualization"
    branch: wrynose
  meta-openembedded:
    url: "https://git.openembedded.org/meta-openembedded"
    branch: wrynose
    layers:
      meta-oe:
      meta-filesystems:
      meta-python:
      meta-networking:
  meta-leda:
    path: ./
    layers:
      meta-leda-components:
      meta-leda-score:
