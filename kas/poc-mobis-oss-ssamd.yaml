# Proof-of-concept config: installs the Eclipse SSAM components and one example
# SSAM package into the image. Not part of the distributed configurations; the
# components are not in a packagegroup yet (see the meta-leda-components README).
#
#   kas build .config.yaml:kas/poc-mobis-oss-ssamd.yaml --target sdv-image-full
#
header:
  version: 12
local_conf_header:
  ssam: |
    IMAGE_INSTALL:append = " ssamd ssam ssam-wrap ssam-package-helloworld"
    # Keep work directories so that generated artifacts (the .ssam package,
    # config.toml, runtime.json) can be inspected. The default config uses
    # rm_work; the build host has enough disk space for this test.
    INHERIT:remove = " rm_work"
