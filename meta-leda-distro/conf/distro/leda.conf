require conf/distro/poky.conf

require conf/distro/include/buildinfo.inc
require conf/distro/include/leda-distro-features.inc
require conf/distro/include/leda-install-packages.inc
require conf/distro/include/leda-oss-compliance.inc
require conf/distro/include/leda-package-blacklist.inc
require conf/distro/include/leda-qemu-settings.inc

# Potential machine-specific overrides, supporting patches to existing meta layers
# Example is "meta-leda/conf/machine/raspberrypi4-64-extra.conf" which
# extends "meta-raspberrypi/conf/machine/raspberrypi4-64.conf"
include conf/machine/${MACHINE}-extra.conf

DISTRO = "leda"
DISTRO_NAME = "Eclipse Leda"
DISTRO_VERSION = "2026"
DISTRO_CODENAME = "Stuttgart"

MAINTAINER = "Eclipse Leda Committers <leda-dev@eclipse.org>"

# Ensure timestamp of rootfs and kernel are updated (non-reproducable-build)
BUILD_REPRODUCIBLE_BINARIES = "0"
REPRODUCIBLE_TIMESTAMP_ROOTFS = ""

# Exluding - not to delete images. They are needed by wic
RM_WORK_EXCLUDE += " sdv-image-full"
RM_WORK_EXCLUDE += " sdv-image-minimal"
RM_WORK_EXCLUDE += " sdv-image-rescue"
RM_WORK_EXCLUDE += " sdv-image-data"

# Reenable for debugging purposes
# RM_WORK_EXCLUDE += " sdv-image-all"
# RM_WORK_EXCLUDE += " sdv-rauc-bundle-full"
# RM_WORK_EXCLUDE += " sdv-rauc-bundle-minimal"
# RM_WORK_EXCLUDE += " sdv-rauc-bundle-rescue"

INIT_MANAGER = "systemd"

VIRTUAL-RUNTIME_container_runtime = "crun"

# The image cache is part of sdv-image-data, mounted at /data at runtime.
PREINSTALLED_CTR_IMAGES_DIR = "/data/var/containers/images"

LEDA_YORIITO_DEPLOYMENT ?= "native"
LEDA_YORIITO_CONTAINER_REF = "localhost/leda/kura:integration"

# Keep the host tools and the cached container on the accepted Databroker release.
PREFERRED_VERSION_databroker = "0.7.1"
PREFERRED_VERSION_databroker-cli = "0.7.1"

# QEMU adds GNU tar for testimage sparse archives, not for booting.
# Keep the images' GPLv3 exclusion; BusyBox supplies the tar applet.
MACHINE_ESSENTIAL_EXTRA_RDEPENDS:remove = "tar"

QB_KERNEL_CMDLINE_APPEND = "net.ifnames=0 panic=5 ip=dhcp ip=192.168.7.2::192.168.7.1:255.255.255.0::eth0:off rootwait"