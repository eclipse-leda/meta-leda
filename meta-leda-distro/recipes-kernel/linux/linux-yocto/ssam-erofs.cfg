# ssam-wrap stores the root of an SSAM package in an EROFS image (erofs,
# erofs-lz4 or erofs-lz4hc, the default). ssamd maps the image read-only
# through a dm-verity device and mounts it, so the kernel needs the EROFS
# file system; dm-verity is already enabled (CONFIG_DM_VERITY).
CONFIG_EROFS_FS=y
