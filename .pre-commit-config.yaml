#
# pre-commit hooks for the meta-leda repository.
#
# Enable them in a checkout:
#
#     pip3 install pre-commit
#     pre-commit install
#
# Check the full tree once (also useful in CI):
#
#     pre-commit run --all-files
#
# What is validated:
# - YAML syntax of the GitHub workflow files (.github/) and of the kas build
#   configurations (kas/, .config.yaml)
# - Markdown syntax of the top level documentation (./*.md) and of docs/
#
# The linters are installed into a virtual environment by pre-commit on first
# use, so only python3 and network access are needed. Style rules that only
# affect prose formatting or that clash with the Eclipse boilerplate files
# (long lines, bare URLs, multiple top level headings) are switched off so
# that the checked-in tree stays clean.
#
repos:
  - repo: local
    hooks:
      - id: yaml-syntax
        name: Validate YAML (kas configs and GitHub workflows)
        entry: >-
          yamllint -d "{rules: {document-start: false, line-length: false}}"
        language: python
        additional_dependencies: [yamllint]
        types: [yaml]
        files: ^(\.config\.ya?ml|kas/.*\.ya?ml|\.github/.*\.ya?ml)$
      - id: markdown-lint
        name: Validate Markdown (README and docs/)
        entry: pymarkdown --disable-rules MD013,MD030,MD034,MD041,MD025 scan
        language: python
        additional_dependencies: [pymarkdownlnt]
        types: [markdown]
        files: ^([^/]+\.md|docs/.*\.md)$
