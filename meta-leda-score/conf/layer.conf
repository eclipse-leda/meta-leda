BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-leda-score"
BBFILE_PATTERN_meta-leda-score := "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-leda-score = "7"

LAYERDEPENDS_meta-leda-score += "core"

LAYERSERIES_COMPAT_meta-leda-score = "kirkstone"
