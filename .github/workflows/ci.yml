#
# One workflow, everything in one job, in order:
#
#   pre-commit linting -> cache download -> the three dry-runs -> cache upload
#
# The cheap check runs first and a failing step fails the job, so the
# expensive steps never start for a tree that does not even parse. GitHub
# has no dependency between workflows, which is why this is one workflow.
#
# The dry-runs parse all recipes and let BitBake resolve the dependency
# tree of the default target for every machine of the matrix. No task is
# executed, a full build does not fit into the limits of the free GitHub
# runners, see docs/ci-build-matrix.md.
#
# The machines are steps of one job on one runner: they share the build
# directory, so the parse cache of the first machine is reused by the next
# ones, and they cost one runner slot instead of three.
#
# The two cache steps carry the parse cache (build/cache, ~15 MB) and the
# repository mirrors of the next runs (KAS_REPO_REF_DIR) over to the next
# run of the matrix, which is what makes the second run fast.
#
name: CI
on:
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    name: Lint and BitBake dry-runs
    runs-on: ubuntu-latest
    env:
      # The dry-runs only need the pinned trees, never their history.
      KAS_CLONE_DEPTH: 1
      # Bare mirrors of the layer repositories, kept in this directory and
      # carried over by the cache steps. kas clones from the mirror instead
      # of the network, which is the difference between minutes and seconds.
      KAS_REPO_REF_DIR: .kas-repo-ref
    steps:
    - name: Checkout
      uses: actions/checkout@v3
    # The language: system hooks of .pre-commit-config.yaml need these from
    # the distribution, see docs/pre-commit.md.
    - name: Install hook tools
      run: sudo apt-get update -y && sudo apt-get install -y --no-install-recommends jq shellcheck openssl
    # The cheap check first: the hooks of .pre-commit-config.yaml over the
    # whole tree, the same command the contributors run locally, see
    # docs/pre-commit.md. A failing step fails the job, so the expensive
    # steps below never start for a tree that does not even parse.
    # The upstream action needs the interpreter from actions/setup-python,
    # not the one of the distribution, see docs/pre-commit.md.
    - name: Set up Python
      uses: actions/setup-python@v5
    - name: Pre-commit linting
      uses: pre-commit/action@v3.0.1
    # kas is not on the runner, the other tools a dry-run needs already
    # are. The apparmor fix is needed on Ubuntu 24.04, see
    # https://bugs.launchpad.net/ubuntu/+source/apparmor/+bug/2056555
    - name: Install kas
      run: |
        sudo pip3 install kas
        sudo apparmor_parser -R /etc/apparmor.d/unprivileged_userns
    - name: Cache download
      uses: actions/cache@v3
      with:
        action: restore
        key: kas-wrynose-v1
        path: |
          build/cache
          .kas-repo-ref
    # The default machine of kas/.config-wrynose.yaml.
    - name: DryRun wrynose (qemux86-64)
      run: kas build kas/.config-wrynose.yaml -- --dry-run
    # The same config, the machine is switched with the kas variable.
    - name: DryRun wrynose (qemuarm64)
      env:
        KAS_MACHINE: qemuarm64
      run: kas build kas/.config-wrynose.yaml -- --dry-run
    # The machine that needs the extra layers, so it has its own config.
    - name: DryRun wrynose (raspberrypi4-64)
      run: kas build kas/.config-wrynose-rpi4.yaml -- --dry-run
    - name: Cache upload
      uses: actions/cache@v3
      with:
        action: create
        key: kas-wrynose-v1
        path: |
          build/cache
          .kas-repo-ref
